site_name: Alif
site_description: Alif is an open-source platform by Alif Edtech tailored for learning experiences.
contact_email: hi@learnhouse.app

# This config is optimized for local development. You can change the values according to your needs.

general:
  development_mode: true
  install_mode: true

security:
  auth_jwt_secret_key: secret

hosting_config:
  domain: learnhouse.app
  ssl: true
  port: 1338
  allowed_origins:
    - http://localhost:3000
    - http://localhost:3001
    - http://127.0.0.1:3000
    - http://127.0.0.1:3001
  cookies_config:
    domain: ".localhost"
  allowed_regexp: '.*'
  content_delivery:
    type: "filesystem" # "filesystem" or "s3api"
    s3api:
      bucket_name: ""
      endpoint_url: ""

mailing_config:
  resend_api_key: ""
  system_email_adress: ""

database_config:
  sql_connection_string: postgresql://alif:alif@localhost:5432/alif

redis_config:
  redis_connection_string: redis://localhost:6379/alif

payments_config:
  stripe:
    stripe_secret_key: ""
    stripe_publishable_key: ""
    stripe_webhook_standard_secret: ""
    stripe_client_id: ""

ai_config:
  openai_api_key: "" # OpenAI API key for embeddings
  groq_api_key: "" # Groq API key for LLM inference
  default_embedding_model: "text-embedding-ada-002" # Still using OpenAI for embeddings
  default_llm_model: "meta-llama/llama-4-scout-17b-16e-instruct" # Groq's Llama 4 Scout model
  llm_provider: "groq" # Can be "openai" or "groq"
  chromadb_config:
    isSeparateDatabaseEnabled: True
    db_host: "localhost"
